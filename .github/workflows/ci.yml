name: CI

on:
  # Branches with a PR are tested by the pull_request run; testing their pushes too
  # ran every commit twice, and the duplicate runs sometimes never got a runner.
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes well under a minute; a stall should fail fast and keep its logs.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=verbose
      - run: npm run build
      - run: npm audit --omit=dev
