# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the Socket.io game server as a free web service. The client is
# deployed separately, to GitHub Pages (.github/workflows/pages.yml).
services:
  - type: web
    name: netcode-pong-server
    runtime: node
    plan: free
    # Only runtime dependencies: Node runs the server's TypeScript directly.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Node 22.12 or later is required; "22" gets the latest 22.x.
      - key: NODE_VERSION
        value: "22"
      # Your GitHub Pages origin, e.g. https://rdbagwell.github.io (no path, no trailing slash).
      # Render asks for this value when you create the Blueprint.
      - key: ALLOWED_ORIGINS
        sync: false
      # Render sits behind Cloudflare, which overwrites True-Client-IP; used for
      # per-IP rate limits. X-Forwarded-For hop counting is the fallback.
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: TRUST_PROXY_HOPS
        value: "1"
      # The client is served by GitHub Pages, not by this service.
      - key: SERVE_CLIENT
        value: "false"
      - key: SNAPSHOT_RATE
        value: "20"
      - key: LAG_COMPENSATION
        value: "false"
